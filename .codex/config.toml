# saucedemo-loop — Codex project config
# Shared browser connector. Both the hunter (the automation thread) and the
# bug-verifier subagent inherit this MCP server; do not duplicate it per-agent.

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest"]
startup_timeout_sec = 30

# Subagent fan-out limits. Keep these tight for a single-target loop.
[agents]
max_threads = 4
max_depth = 1
